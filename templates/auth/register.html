{% extends "base.html" %}


{% block title %}
Registro
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Crear cuenta</h1>

    <form method="POST">

        <label>
            Usuario
        </label>

        <input
            type="text"
            name="username"
            minlength="3"
            required
        >

        <label>
            Correo electrónico
        </label>

        <input
            type="email"
            name="email"
            required
        >

        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            minlength="6"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

</div>

{% endblock %}

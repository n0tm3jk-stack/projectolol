{% extends "base.html" %}


{% block title %}
Login
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Iniciar sesión</h1>

    <form method="POST">

        <label>
            Usuario
        </label>

        <input
            type="text"
            name="username"
            required
        >

        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

{% endblock %}
